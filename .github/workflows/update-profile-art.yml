name: Update profile contribution art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
      - name: Fetch public repository stats
        run: python scripts/fetch_profile_stats.py
      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py
      - name: Commit refreshed art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json data/profile_stats.json contrib-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh profile activity [skip ci]"
            git push origin HEAD:main
          fi
