<text x="25" y="81" fill="#e9f3f3" font-family="monospace" font-size="27" font-weight="bold">Deep neural nets trained. Systems made useful.</text>
<text x="26" y="107" fill="#91a8b5" font-family="monospace" font-size="12" font-weight="normal">Public projects with code, model artifacts, and reproducible details.</text>
